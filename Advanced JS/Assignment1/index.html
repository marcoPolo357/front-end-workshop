<!DOCTYPE html>

<html>

    <head>

        <title>Adv. JS - Assignment 1</title>

    </head>

    <body>

        <script>

            class Student {

                constructor(name, address, phone, course) {
                    this.name = name;
                    this.address = address;
                    this.phone = phone;
                    this.course = course;
                }

                getInfo() {
                    return "Name: " + this.name + "\n" +
                    "Address: " + this.address + "\n" +
                    "Phone: " + this.phone + "\n" +
                    "Course: " + this.course
                }
            }

            var student1 = new Student("John Benson", "High Park 36", "(507) 833-3567", "Geography");
            var student2 = new Student("Eddie Murphy", "Sunset Blvd. 357", "(102) 333-5555", "Literature");
            var student3 = new Student("Jose Valderama", "Pine Drive 33", "(300) 100-3236", "Multimedia");

            console.log(student1.getInfo());
            console.log(student2.getInfo());
            console.log(student3.getInfo());

        </script>

    </body>

</html>
